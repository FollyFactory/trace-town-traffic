# Traces, in Grafana Tempo, with Grafana in front of it.
#
#   docker compose -f deploy/tempo.yml --profile generator up -d
#
# Grafana  http://localhost:3000   (no login)
name: trace-town-tempo

services:
  collector:
    image: otel/opentelemetry-collector-contrib:0.140.0
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./config/collector-tempo.yaml:/etc/otel/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      - tempo
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.9.1
    command: ["-config.file=/etc/tempo/config.yaml"]
    user: root
    volumes:
      - ./config/tempo.yaml:/etc/tempo/config.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.3.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./config/grafana/tempo.yaml:/etc/grafana/provisioning/datasources/tempo.yaml:ro
    ports:
      - "3000:3000"
    depends_on:
      - tempo
    restart: unless-stopped

  # Off unless you ask for it: --profile generator
  generator:
    profiles: ["generator"]
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["examples/ecommerce.json", "--endpoint", "http://collector:4318"]
    environment:
      TRAFFIC_CONTROL_HOST: 0.0.0.0
    ports:
      - "8080:8080"
    depends_on:
      collector:
        condition: service_started
    restart: unless-stopped

volumes:
  tempo-data:
