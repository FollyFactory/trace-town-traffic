# Application Insights takes all three signals, so nothing is discarded here —
# this is the only setup in the repo where every pipeline has a real exporter.
#
# The backend is Azure rather than a container, so the only thing this file
# needs from you is a connection string. It comes from the environment so that
# it is never written down in the repo: see deploy/.env, which is gitignored.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Larger and slower than the local setups. Every batch is a billed HTTPS round
  # trip to Azure rather than a hop to the container next door, and the
  # exporter batches again on its own behalf underneath this.
  batch:
    timeout: 5s
    send_batch_size: 2048

  # One correction, and it is not optional: without it most of the service map
  # points at the empty string. It is not guesswork either — the envelopes the
  # exporter builds were captured and read.
  transform/azure:
    error_mode: ignore
    trace_statements:
      # `target` is empty on every database, cache and queue dependency — which
      # is most of the interesting ones. It is an upstream bug rather than
      # anything missing here: fillRemoteDependencyDataDatabase and
      # fillRemoteDependencyDataMessaging both read `client.address` and fall
      # back to `network.peer.address`, when what a client span carries is
      # `server.address`. HTTP is unaffected because it takes its target from
      # `url.full` instead, which is why the http edges look fine and hide the
      # problem.
      #
      # Copying the address onto the attribute the fallback does read gets
      # `postgres-orders` and `redis-sessions` into `target`. The port is
      # deliberately not copied: the exporter appends `client.port`, not the
      # peer port, so a bare address comes out formatted exactly like the HTTP
      # targets beside it.
      - context: span
        statements:
          - set(span.attributes["network.peer.address"], span.attributes["server.address"])
            where span.attributes["server.address"] != nil
              and span.attributes["network.peer.address"] == nil

  # NOTE: `service.namespace` used to be deleted here as well.
  #
  # The exporter folds it into the identity — `cloud_RoleName` is
  # `service.namespace + "." + service.name` — while a dependency's `target`
  # stays the bare hostname, so the two ends of every edge stopped matching and
  # deleting the namespace was the cheap fix. It cost the districts: a town that
  # joined up and had no neighbourhoods in it.
  #
  # That trade is gone. Trace Town's Azure adapter now removes the prefix itself,
  # using the namespace it reads back off the same row, so the identity is bare
  # *and* the district survives. Leaving the namespace alone is also the right
  # thing for everyone not reading this file, since it is what Azure's own
  # Application Map groups by.

exporters:
  # `azuremonitor`, not `azure_monitor`. Upstream renamed this component to
  # `azure_monitor` after 0.140.0, so the README on main and the collector this
  # file is pinned to disagree, and getting it wrong is not a warning — the
  # collector refuses the whole config and the container exits immediately.
  # Whoever bumps the image next will have to change this line.
  azuremonitor:
    connection_string: ${env:APPLICATIONINSIGHTS_CONNECTION_STRING}
    maxbatchsize: 1024
    maxbatchinterval: 10s

service:
  telemetry:
    logs:
      # Ingestion failures — a malformed connection string, a daily cap hit —
      # are reported here and nowhere else. `docker compose -f
      # deploy/appinsights.yml logs collector` is the first thing to read when
      # the portal stays empty.
      level: info
  pipelines:
    traces:
      receivers: [otlp]
      processors: [transform/azure, batch]
      exporters: [azuremonitor]
    metrics:
      receivers: [otlp]
      processors: [transform/azure, batch]
      exporters: [azuremonitor]
    logs:
      receivers: [otlp]
      processors: [transform/azure, batch]
      exporters: [azuremonitor]
