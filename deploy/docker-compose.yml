# A complete local observability stack for trace-town-traffic.
#
#   docker compose -f deploy/docker-compose.yml up -d
#
# Grafana      http://localhost:3000   (anonymous admin, no login)
# Jaeger       http://localhost:16686
# Prometheus   http://localhost:9090
#
# The generator itself is not started by default — run it on the host against
# localhost:4318, or bring it up with the `generator` profile:
#
#   docker compose -f deploy/docker-compose.yml --profile generator up -d

name: trace-town-traffic

services:
  collector:
    image: otel/opentelemetry-collector-contrib:0.140.0
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otel/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    depends_on:
      jaeger:
        condition: service_started
      prometheus:
        condition: service_started
      loki:
        condition: service_started
    restart: unless-stopped

  jaeger:
    image: jaegertracing/jaeger:2.11.0
    ports:
      - "16686:16686"  # UI
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.7.3
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # The collector pushes metrics in over OTLP rather than being scraped.
      - --web.enable-otlp-receiver
      - --web.enable-lifecycle
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped

  loki:
    image: grafana/loki:3.5.7
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./loki.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.3.1
    environment:
      # Local stack, no secrets in it — a login prompt would just be in the way.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_FEATURE_TOGGLES_ENABLE: traceToMetrics
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki
      - jaeger
    restart: unless-stopped

  # Optional: run the generator in the stack instead of on the host.
  generator:
    profiles: ["generator"]
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["examples/ecommerce.json", "--endpoint", "http://collector:4318"]
    environment:
      # Bind the control API to all interfaces so it is reachable from the host.
      TRAFFIC_CONTROL_HOST: 0.0.0.0
    ports:
      - "8080:8080"
    depends_on:
      collector:
        condition: service_started
    restart: unless-stopped

volumes:
  prometheus-data:
  loki-data:
  grafana-data:
