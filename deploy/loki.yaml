# Minimal single-binary Loki, filesystem-backed. Fine for a local stack and
# entirely unsuitable for anything else.
auth_enabled: false

server:
  http_listen_port: 3100
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # OTLP log records carry trace_id and span_id as structured metadata, which is
  # what makes a log line clickable through to its trace.
  allow_structured_metadata: true
  volume_enabled: true
  reject_old_samples: false

ruler:
  alertmanager_url: http://localhost:9093

analytics:
  reporting_enabled: false
