# Collector config for the bundled stack. The generator speaks plain OTLP, so
# nothing here is required to use the tool — swap this out for whatever your
# own pipeline looks like.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 2s
    send_batch_size: 2048

  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 20

  # Promote the simulated service identity onto every metric as a label, so a
  # Prometheus query can group by service without going through resource
  # attributes. Real deployments often do exactly this.
  resource:
    attributes:
      - key: collector.name
        value: trace-town-traffic
        action: upsert

# Derived signals, computed from the spans as they pass through. This is what a
# real OpenTelemetry deployment looks like, and what most tools expect to read:
# RED metrics and a service graph that come from the traces themselves rather
# than from each service being separately instrumented to report them.
connectors:
  # trace.* spans in, calls/duration metrics out, tagged by service.
  spanmetrics:
    histogram:
      explicit:
        buckets: [2ms, 5ms, 10ms, 25ms, 50ms, 100ms, 250ms, 500ms, 1s, 2s, 5s, 10s]
    dimensions:
      - name: http.request.method
      - name: http.response.status_code
      - name: db.system.name
      - name: messaging.system
    exemplars:
      enabled: false
    metrics_flush_interval: 15s

  # Client/server span pairs in, edges out — including the ones that are only
  # ever the far end of somebody's call, which is every database and broker.
  servicegraph:
    latency_histogram_buckets: [2ms, 10ms, 50ms, 100ms, 250ms, 1s, 5s]
    dimensions: [db.system.name, messaging.system]
    store:
      ttl: 10s
      max_items: 10000

exporters:
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true

  otlphttp/prometheus:
    endpoint: http://prometheus:9090/api/v1/otlp

  otlphttp/loki:
    endpoint: http://loki:3100/otlp

  # Uncomment to watch telemetry go past on the collector's own stdout.
  # debug:
  #   verbosity: detailed

service:
  telemetry:
    logs:
      level: info

  pipelines:
    # Spans fan out three ways: to Jaeger as traces, and into the two connectors
    # that turn them into metrics.
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [otlp/jaeger, spanmetrics, servicegraph]

    # Both the metrics the services report themselves and the ones derived from
    # their spans end up in the same store, which is exactly the situation a
    # reader has to cope with in the wild.
    metrics:
      receivers: [otlp, spanmetrics, servicegraph]
      processors: [memory_limiter, resource, batch]
      exporters: [otlphttp/prometheus]

    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [otlphttp/loki]
