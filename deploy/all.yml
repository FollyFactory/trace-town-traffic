# Jaeger, Prometheus, Loki and Grafana together, fed from one collector.
#
#   docker compose -f deploy/all.yml --profile generator up -d
#
# Grafana     http://localhost:3000   (all three wired up, no login)
# Jaeger      http://localhost:16686
# Prometheus  http://localhost:9090
#
# Heavier than any single setup. Worth it when you want to see the same
# telemetry rendered three ways; otherwise start from one of the others.
name: trace-town-all

services:
  collector:
    image: otel/opentelemetry-collector-contrib:0.140.0
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./config/collector-all.yaml:/etc/otel/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      - jaeger
      - prometheus
      - loki
    restart: unless-stopped

  jaeger:
    image: jaegertracing/jaeger:2.11.0
    ports:
      - "16686:16686"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.7.3
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-otlp-receiver
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped

  loki:
    image: grafana/loki:3.5.7
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./config/loki.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.3.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./config/grafana/all.yaml:/etc/grafana/provisioning/datasources/all.yaml:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki
      - jaeger
    restart: unless-stopped

  # Off unless you ask for it: --profile generator
  generator:
    profiles: ["generator"]
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["examples/ecommerce.json", "--endpoint", "http://collector:4318"]
    environment:
      TRAFFIC_CONTROL_HOST: 0.0.0.0
    ports:
      - "8080:8080"
    depends_on:
      collector:
        condition: service_started
    restart: unless-stopped

volumes:
  prometheus-data:
  loki-data:
